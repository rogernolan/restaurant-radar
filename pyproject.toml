[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "restaurant-radar"
version = "0.1.0"
description = "A tiny weekly RSS experiment for restaurant review trends."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
dependencies = []

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
restaurant-radar = "restaurant_radar.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.packages.find]
where = ["src"]
